<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Flyer</title>
<style>
  body { font-family: Georgia, serif; max-width: 600px; margin: 40px auto; background: #fdf6e3; color: #333; padding: 20px; }
  h1 { color: #8B4513; border-bottom: 2px solid #8B4513; padding-bottom: 10px; }
  dl { display: grid; grid-template-columns: max-content auto; gap: 8px 20px; }
  dt { font-weight: bold; color: #555; }
  dd { margin: 0; }
  .weather { background: #e8f4f8; padding: 10px; border-radius: 6px; margin: 16px 0; }
  .cost { background: #f0f8e8; padding: 10px; border-radius: 6px; margin: 16px 0; }
</style>
</head>
<body>
<h1>🍺 Edinburgh Pub Event</h1>
<dl>
  <dt>Venue</dt><dd data-testid="venue_name">Haymarket Tap</dd>
  <dt>Address</dt><dd data-testid="venue_address">12 Dalry Rd, Edinburgh EH11 2BG</dd>
  <dt>Date</dt><dd data-testid="date">2026-04-25</dd>
  <dt>Time</dt><dd data-testid="time">19:30</dd>
  <dt>Party size</dt><dd data-testid="party_size">6</dd>
</dl>
<div class="weather">
  <strong>🌤 Weather forecast:</strong>
  <span data-testid="condition">cloudy</span>,
  <span data-testid="temperature_c">12C</span>
</div>
<div class="cost">
  <strong>💷 Cost breakdown:</strong><br>
  Total: <span data-testid="total_gbp">£1190</span><br>
  Deposit required: <span data-testid="deposit_required_gbp">£357</span>
</div>
</body>
</html>
